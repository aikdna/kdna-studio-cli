name: CI

on: [pull_request, push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20.8', '22.23.1']
    env:
      KDNA_CORE_CANDIDATE_REPOSITORY: aikdna/kdna
      KDNA_CORE_CANDIDATE_COMMIT: 336d79415708d0ec5007c6d770e50a0c7711b32b
      KDNA_STUDIO_CORE_CANDIDATE_REPOSITORY: aikdna/kdna-studio-core
      KDNA_STUDIO_CORE_CANDIDATE_COMMIT: 176e0264f30a0b62f5680b56db84bd90dff83dfe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Check out the exact Runtime candidates outside the Studio CLI workspace
        run: |
          set -euo pipefail
          runner_temp="$(realpath "$RUNNER_TEMP")"
          workspace="$(realpath "$GITHUB_WORKSPACE")"

          checkout_candidate() {
            repository="$1"
            commit="$2"
            directory="$3"
            environment_name="$4"
            candidate_source="$runner_temp/$directory"
            test ! -e "$candidate_source"
            git init --quiet "$candidate_source"
            git -C "$candidate_source" remote add origin "https://github.com/$repository.git"
            git -C "$candidate_source" fetch --quiet --no-tags --depth=1 origin "$commit"
            git -C "$candidate_source" checkout --quiet --detach "$commit"
            test "$(git -C "$candidate_source" rev-parse HEAD)" = "$commit"
            candidate_source="$(realpath "$candidate_source")"
            case "$candidate_source" in
              "$runner_temp"/*) ;;
              *) exit 1 ;;
            esac
            case "$candidate_source" in
              "$workspace"/*) exit 1 ;;
            esac
            echo "$environment_name=$candidate_source" >> "$GITHUB_ENV"
          }

          checkout_candidate \
            "$KDNA_CORE_CANDIDATE_REPOSITORY" \
            "$KDNA_CORE_CANDIDATE_COMMIT" \
            "kdna-core-candidate" \
            "KDNA_CORE_CANDIDATE_SOURCE"
          checkout_candidate \
            "$KDNA_STUDIO_CORE_CANDIDATE_REPOSITORY" \
            "$KDNA_STUDIO_CORE_CANDIDATE_COMMIT" \
            "kdna-studio-core-candidate" \
            "KDNA_STUDIO_CORE_CANDIDATE_SOURCE"
      - name: Select the trusted release-tool runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
          check-latest: false
      - name: Acquire and verify the audited npm release bytes
        run: |
          node scripts/acquire-trusted-npm-release.js --out "$RUNNER_TEMP/npm-11.17.0.tgz"
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - run: node scripts/run-trusted-npm.js ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --@aikdna:registry=https://registry.npmjs.org/
      - name: Reproduce both checked candidate artifacts from their exact clean sources
        run: node scripts/run-trusted-npm.js run verify:candidate-sources
      - name: Select the declared product runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '${{ matrix.node }}'
          check-latest: false
      - name: Run the complete release-hardening and product suite
        if: matrix.node == '22.23.1'
        run: node scripts/run-trusted-npm.js run test:all
      - name: Run product and Runtime tests without the Node-22-only trusted npm client
        if: matrix.node == '18.20.8'
        run: node scripts/run-product-tests.js
      - name: Verify the installed Runtime candidate chain from an empty cache under Node 22
        if: matrix.node == '22.23.1'
        run: node scripts/run-trusted-npm.js run test:candidate-chain
      - name: Verify the installed Runtime candidate chain from an empty cache under Node 18
        if: matrix.node == '18.20.8'
        run: npm run test:candidate-chain
